  <!-- cardinal ticks -->
  <g stroke="#FFF8EF" stroke-width="2.6" stroke-linecap="round" opacity="0.9">
    <line x1="60" y1="16" x2="60" y2="23"/>
    <line x1="60" y1="97" x2="60" y2="104"/>
    <line x1="16" y1="60" x2="23" y2="60"/>
    <line x1="97" y1="60" x2="104" y2="60"/>
