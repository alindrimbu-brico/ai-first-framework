<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Busola ARMONIA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="55%" stop-color="#FFB524"/>
      <stop offset="100%" stop-color="#2BB5A0"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#bg)"/>
  <circle cx="60" cy="60" r="38" fill="none" stroke="#FFF8EF" stroke-width="3.5"/>
  <circle cx="60" cy="60" r="31" fill="none" stroke="#FFF8EF" stroke-width="1.4" opacity="0.7"/>
  <!-- compass needle as a flame -->
