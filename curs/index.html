<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Mastery — Curs progresiv | de la fundamente la hub-uri inteligente</title>
  <meta name="description" content="Curs AI progresiv, nivel tehnic: LLM, prompting, API, RAG, agenți, MCP și automatizări — aplicate la construirea unui hub fizic replicabil (frizerie, cafenea, bucătărie)." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Lato:wght@300;400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cognac:    #6B3D2E;
      --cream:     #F5EDD8;
      --gold:      #C9A227;
      --charcoal:  #2A2420;
      --moss:      #4A5240;
      --cream-mid: #EDE0C4;
      --text-dark: #1C1008;
      --text-mid:  #4A3828;
      --footer-bg: #1A1008;
      --font-heading: 'Playfair Display', serif;
      --font-body: 'Lato', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --transition: 0.25s ease;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      font-family: var(--font-body);
      color: var(--text-dark);
      background: var(--cream);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4 { font-family: var(--font-heading); line-height: 1.2; }
    a { color: var(--cognac); text-decoration: none; }
    ul, ol { list-style: none; }

    /* ── LAYOUT ── */
    .app { display: grid; grid-template-columns: 340px 1fr; min-height: 100vh; }

    /* ── SIDEBAR ── */
    .sidebar {
      background: var(--footer-bg);
      color: var(--cream);
      position: sticky; top: 0;
      height: 100vh; overflow-y: auto;
      padding: 28px 22px 60px;
      border-right: 3px solid var(--gold);
    }
    .brand { margin-bottom: 24px; }
    .brand-eyebrow {
      font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
      color: var(--gold); display: block; margin-bottom: 6px;
    }
    .brand h1 { font-size: 26px; color: var(--cream); line-height: 1.1; }
    .brand p { font-size: 12.5px; color: #b8a98a; margin-top: 8px; }

    .progress-wrap { margin: 22px 0 26px; }
    .progress-label {
      display: flex; justify-content: space-between;
      font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
      color: #b8a98a; margin-bottom: 8px;
    }
    .progress-bar { height: 6px; background: #3a2c1e; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0; background: var(--gold); transition: width 0.4s ease; }

    .module-nav > li { margin-bottom: 6px; }
    .module-head {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 10px; cursor: pointer; border-radius: 5px;
      transition: var(--transition);
    }
    .module-head:hover { background: rgba(201,162,39,0.12); }
    .module-num {
      font-family: var(--font-mono); font-size: 11px; font-weight: 600;
      color: var(--footer-bg); background: var(--gold);
      width: 26px; height: 26px; flex-shrink: 0;
      display: grid; place-items: center; border-radius: 5px;
    }
    .module-title { font-size: 13.5px; font-weight: 700; color: var(--cream); flex: 1; }
    .module-caret { font-size: 10px; color: #b8a98a; transition: transform var(--transition); }
    .module.open .module-caret { transform: rotate(90deg); }
    .lesson-list { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
    .module.open .lesson-list { max-height: 800px; }
    .lesson-item {
      display: flex; align-items: center; gap: 9px;
      padding: 7px 10px 7px 20px; margin-left: 12px;
      font-size: 12.5px; color: #cdbf9f; cursor: pointer;
      border-left: 1px solid #3a2c1e; transition: var(--transition);
    }
    .lesson-item:hover { color: var(--cream); border-left-color: var(--gold); }
    .lesson-item.active { color: var(--gold); border-left-color: var(--gold); font-weight: 700; }
    .lesson-check {
      width: 15px; height: 15px; border: 1.5px solid #5a4a34;
      border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
      font-size: 9px; color: var(--footer-bg);
    }
    .lesson-item.done .lesson-check { background: var(--gold); border-color: var(--gold); }
    .lesson-item.done .lesson-check::after { content: "✓"; }

    /* ── MAIN ── */
    .main { padding: 0; }
    .lesson {
      max-width: 820px; margin: 0 auto; padding: 56px 48px 100px;
    }
    .crumb {
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--cognac); margin-bottom: 14px; font-weight: 700;
    }
    .lesson h2 { font-size: 40px; color: var(--charcoal); margin-bottom: 6px; }
    .lesson-meta { display: flex; gap: 16px; align-items: center; margin: 14px 0 30px; flex-wrap: wrap; }
    .tag {
      font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
      background: var(--cream-mid); color: var(--text-mid);
      padding: 4px 12px; border-radius: 20px; font-weight: 700;
    }
    .tag--level { background: var(--moss); color: var(--cream); }
    .gold-line { width: 60px; height: 3px; background: var(--gold); margin: 0 0 30px; }

    .lesson-body h3 {
      font-size: 24px; color: var(--cognac); margin: 38px 0 12px;
      padding-bottom: 8px; border-bottom: 1px solid var(--cream-mid);
    }
    .lesson-body h4 { font-size: 18px; color: var(--charcoal); margin: 26px 0 8px; }
    .lesson-body p { margin-bottom: 16px; color: var(--text-mid); font-size: 16.5px; }
    .lesson-body strong { color: var(--text-dark); }
    .lesson-body ul, .lesson-body ol { margin: 0 0 18px 4px; }
    .lesson-body li {
      position: relative; padding-left: 26px; margin-bottom: 10px;
      color: var(--text-mid); font-size: 16px;
    }
    .lesson-body ul li::before {
      content: "▸"; position: absolute; left: 4px; color: var(--gold); font-weight: 700;
    }
    .lesson-body ol { counter-reset: item; }
    .lesson-body ol li { counter-increment: item; }
    .lesson-body ol li::before {
      content: counter(item); position: absolute; left: 0; top: 0;
      font-family: var(--font-mono); font-size: 12px; font-weight: 600;
      color: var(--gold); background: var(--charcoal);
      width: 20px; height: 20px; border-radius: 4px; display: grid; place-items: center;
    }

    .callout {
      background: var(--cream-mid); border-left: 4px solid var(--gold);
      padding: 18px 22px; margin: 24px 0; border-radius: 0 8px 8px 0;
    }
    .callout--hub { border-left-color: var(--cognac); background: #efe6d0; }
    .callout-label {
      font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--gold); font-weight: 700; display: block; margin-bottom: 6px;
    }
    .callout--hub .callout-label { color: var(--cognac); }
    .callout p:last-child { margin-bottom: 0; }

    pre {
      background: var(--charcoal); color: #e8dcc0; border-radius: 8px;
      padding: 20px 22px; overflow-x: auto; margin: 20px 0;
      font-family: var(--font-mono); font-size: 13.5px; line-height: 1.6;
      border: 1px solid #000;
    }
    pre .c { color: #8a7a5a; }   /* comment */
    pre .k { color: var(--gold); }  /* keyword */
    pre .s { color: #c9d6a0; }   /* string */
    code:not(pre code) {
      font-family: var(--font-mono); font-size: 0.88em;
      background: var(--cream-mid); color: var(--cognac);
      padding: 2px 6px; border-radius: 4px;
    }

    .keyterm { border-bottom: 2px dotted var(--gold); font-weight: 700; color: var(--text-dark); }

    table.def { width: 100%; border-collapse: collapse; margin: 22px 0; font-size: 15px; }
    table.def th, table.def td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--cream-mid); vertical-align: top; }
    table.def th { background: var(--charcoal); color: var(--cream); font-family: var(--font-body); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
    table.def td:first-child { font-weight: 700; color: var(--cognac); white-space: nowrap; }

    .exercise {
      border: 2px dashed var(--cognac); border-radius: 10px;
      padding: 22px 24px; margin: 30px 0; background: #faf4e4;
    }
    .exercise-label {
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--cognac); font-weight: 700; margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }

    .lesson-footer {
      display: flex; justify-content: space-between; align-items: center;
      gap: 16px; margin-top: 50px; padding-top: 28px; border-top: 2px solid var(--cream-mid);
      flex-wrap: wrap;
    }
    .btn {
      font-family: var(--font-body); font-weight: 700; font-size: 12px;
      letter-spacing: 1.5px; text-transform: uppercase; padding: 13px 26px;
      cursor: pointer; border: none; border-radius: 4px; transition: var(--transition);
    }
    .btn--done { background: var(--gold); color: var(--footer-bg); }
    .btn--done:hover { background: var(--charcoal); color: var(--gold); }
    .btn--done.is-done { background: var(--moss); color: var(--cream); }
    .btn--nav { background: transparent; color: var(--cognac); border: 1.5px solid var(--cognac); }
    .btn--nav:hover { background: var(--cognac); color: var(--cream); }
    .btn--nav:disabled { opacity: 0.3; cursor: not-allowed; }

    .placeholder { text-align: center; padding: 40px 20px; }
    .placeholder .big { font-size: 60px; margin-bottom: 10px; }
    .placeholder p { color: var(--text-mid); font-style: italic; }

    /* ── PINNED NAV (Manifest) ── */
    .pinned-nav { margin-bottom: 18px; }
    .pinned-item {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 14px; cursor: pointer; border-radius: 8px;
      background: linear-gradient(135deg, rgba(201,162,39,0.16), rgba(201,162,39,0.04));
      border: 1px solid rgba(201,162,39,0.35);
      transition: var(--transition);
    }
    .pinned-item:hover { border-color: var(--gold); background: linear-gradient(135deg, rgba(201,162,39,0.28), rgba(201,162,39,0.08)); }
    .pinned-item.active { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 6px 20px rgba(201,162,39,0.15); }
    .pinned-star { color: var(--gold); font-size: 16px; }
    .pinned-item .pt { font-family: var(--font-heading); font-style: italic; font-size: 15px; color: var(--cream); flex: 1; }
    .pinned-item .ps { display: block; font-family: var(--font-body); font-style: normal; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 2px; }

    /* ── MANIFEST (glamorous) ── */
    .manifest {
      max-width: 900px; margin: 0 auto;
      padding: 0 0 110px;
    }
    .manifest-hero {
      position: relative;
      padding: 92px 56px 70px;
      background:
        radial-gradient(1200px 500px at 50% -10%, rgba(201,162,39,0.18), transparent 60%),
        linear-gradient(160deg, #241812 0%, var(--footer-bg) 55%, #120a05 100%);
      color: var(--cream);
      overflow: hidden;
      text-align: center;
    }
    .manifest-hero::before {
      content: ""; position: absolute; inset: 0;
      background-image:
        repeating-linear-gradient(45deg, rgba(201,162,39,0.05) 0 2px, transparent 2px 22px);
      opacity: 0.4; pointer-events: none;
    }
    .manifest-hero::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .m-eyebrow {
      position: relative; font-size: 11px; letter-spacing: 6px; text-transform: uppercase;
      color: var(--gold); margin-bottom: 22px;
    }
    .m-monogram {
      position: relative; width: 78px; height: 78px; margin: 0 auto 26px;
      border: 2px solid var(--gold); border-radius: 50%;
      display: grid; place-items: center;
      font-family: var(--font-heading); font-size: 34px; font-style: italic; color: var(--gold);
      box-shadow: 0 0 0 6px rgba(201,162,39,0.08), inset 0 0 24px rgba(201,162,39,0.12);
    }
    .manifest-hero h1 {
      position: relative; font-size: 62px; line-height: 1.05; margin-bottom: 8px;
      background: linear-gradient(180deg, #fbf3d8 0%, var(--gold) 120%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 2px 40px rgba(201,162,39,0.15);
    }
    .manifest-hero h1 em { font-style: italic; }
    .m-tagline {
      position: relative; font-family: var(--font-heading); font-style: italic;
      font-size: 21px; color: #d8c9a4; margin-top: 14px; font-weight: 400;
    }
    .m-flourish {
      position: relative; display: flex; align-items: center; justify-content: center;
      gap: 14px; margin: 30px 0 0; color: var(--gold); font-size: 13px;
    }
    .m-flourish::before, .m-flourish::after {
      content: ""; height: 1px; width: 70px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }
    .m-flourish::after { background: linear-gradient(90deg, var(--gold), transparent); }

    .manifest-body { padding: 56px 56px 0; }
    .m-section { margin-bottom: 54px; }
    .m-kicker {
      font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
      color: var(--gold); font-weight: 700; margin-bottom: 10px;
    }
    .m-section > h2 {
      font-size: 34px; color: var(--charcoal); margin-bottom: 20px;
    }
    .m-section > h2 .num {
      font-family: var(--font-mono); font-size: 15px; color: var(--gold);
      vertical-align: super; margin-right: 8px;
    }
    .m-lead { font-size: 19px; color: var(--text-mid); line-height: 1.75; }
    .m-lead:first-letter {
      float: left; font-family: var(--font-heading); font-size: 74px; line-height: 0.72;
      color: var(--cognac); margin: 10px 14px 0 0; font-weight: 700;
    }
    .m-section p { font-size: 17px; color: var(--text-mid); margin-bottom: 16px; line-height: 1.75; }
    .m-quote {
      font-family: var(--font-heading); font-style: italic; font-size: 24px;
      color: var(--cognac); text-align: center; line-height: 1.5;
      padding: 30px 40px; margin: 34px 0; position: relative;
    }
    .m-quote::before, .m-quote::after {
      content: "”"; font-size: 60px; color: var(--gold); opacity: 0.5;
      position: absolute; font-family: var(--font-heading);
    }
    .m-quote::before { content: "“"; top: -6px; left: 6px; }
    .m-quote::after { bottom: -34px; right: 10px; }

    .obj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 26px; }
    .obj-card {
      position: relative; padding: 34px 30px 30px;
      background: linear-gradient(160deg, #fffaf0, var(--cream-mid));
      border: 1px solid rgba(201,162,39,0.4); border-radius: 14px;
      box-shadow: 0 12px 40px rgba(107,61,46,0.08);
      transition: var(--transition);
    }
    .obj-card:hover { transform: translateY(-4px); box-shadow: 0 20px 50px rgba(107,61,46,0.16); border-color: var(--gold); }
    .obj-card .obj-badge {
      position: absolute; top: -18px; left: 28px;
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--charcoal); color: var(--gold);
      display: grid; place-items: center; font-family: var(--font-heading);
      font-style: italic; font-size: 20px; border: 2px solid var(--gold);
    }
    .obj-card h3 { font-size: 22px; color: var(--cognac); margin: 14px 0 10px; border: none; padding: 0; }
    .obj-card p { font-size: 15.5px; color: var(--text-mid); margin-bottom: 0; }
    .obj-card .obj-tag {
      display: inline-block; margin-top: 16px; font-size: 10px; letter-spacing: 2px;
      text-transform: uppercase; color: var(--gold); font-weight: 700;
      border-top: 1px solid rgba(201,162,39,0.4); padding-top: 12px;
    }

    .m-cta {
      text-align: center; margin-top: 60px; padding: 44px 30px;
      background: linear-gradient(160deg, #241812, var(--footer-bg));
      border-radius: 16px; color: var(--cream);
      border: 1px solid rgba(201,162,39,0.3);
    }
    .m-cta h3 { font-size: 26px; color: var(--cream); border: none; padding: 0; margin-bottom: 10px; }
    .m-cta h3 em { color: var(--gold); font-style: italic; }
    .m-cta p { color: #c3b48f; margin-bottom: 22px; }
    .btn--enter {
      background: linear-gradient(135deg, var(--gold), #b8901f);
      color: var(--footer-bg); font-size: 13px; letter-spacing: 2px;
      padding: 15px 40px; box-shadow: 0 10px 30px rgba(201,162,39,0.25);
    }
    .btn--enter:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(201,162,39,0.4); }

    /* ── CAFEA — istoria & originile ── */
    .m-subhead {
      font-family: var(--font-heading); font-size: 22px; color: var(--charcoal);
      margin: 36px 0 8px; display: flex; align-items: center; gap: 12px;
    }
    .m-subhead::before { content: "❖"; color: var(--gold); font-size: 16px; }
    .coffee-belt {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 24px;
    }
    .origin-card {
      position: relative; padding: 24px 20px 22px; border-radius: 14px;
      background: linear-gradient(160deg, #2c1d13, #170e07);
      color: var(--cream); border: 1px solid rgba(201,162,39,0.28);
      transition: var(--transition);
    }
    .origin-card:hover { transform: translateY(-5px); border-color: var(--gold); box-shadow: 0 18px 40px rgba(23,14,7,0.35); }
    .origin-card .bean { color: var(--gold); font-size: 15px; letter-spacing: 3px; }
    .origin-card .region { display: block; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #a8996f; margin-top: 12px; }
    .origin-card h4 { color: var(--gold); font-size: 19px; margin: 3px 0 0; border: none; padding: 0; }
    .origin-card .notes {
      font-family: var(--font-heading); font-style: italic; font-size: 15px;
      color: #e8dab6; margin-top: 12px; line-height: 1.55;
      padding-top: 12px; border-top: 1px solid rgba(201,162,39,0.2);
    }
    .assets-line {
      display: flex; flex-wrap: wrap; gap: 14px; justify-content: center;
      margin: 40px 0 8px;
    }
    .asset-chip {
      border: 1px solid var(--gold); color: var(--cognac);
      border-radius: 30px; padding: 11px 24px; background: #fffaf0;
      font-family: var(--font-heading); font-style: italic; font-size: 17px;
      box-shadow: 0 6px 18px rgba(201,162,39,0.1); transition: var(--transition);
    }
    .asset-chip:hover { transform: translateY(-3px); background: var(--charcoal); color: var(--cream); }
    .asset-chip:hover b { color: var(--gold); }
    .asset-chip b { color: var(--gold); font-weight: 700; }
    .assets-note { text-align: center; font-style: italic; color: var(--text-mid); margin-top: 18px; font-size: 16px; }

    @media (max-width: 900px) {
      .coffee-belt { grid-template-columns: 1fr; }
      .manifest-hero { padding: 74px 24px 54px; }
      .manifest-hero h1 { font-size: 42px; }
      .manifest-body { padding: 40px 22px 0; }
      .obj-grid { grid-template-columns: 1fr; gap: 34px; }
    }

    /* ── MOBILE ── */
    .menu-toggle { display: none; }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed; z-index: 50; width: 300px; left: -320px;
        transition: left 0.3s ease; box-shadow: 4px 0 30px rgba(0,0,0,0.4);
      }
      .sidebar.open { left: 0; }
      .menu-toggle {
        display: grid; place-items: center; position: fixed; z-index: 60;
        top: 16px; left: 16px; width: 48px; height: 48px; border-radius: 8px;
        background: var(--footer-bg); color: var(--gold); border: 2px solid var(--gold);
        font-size: 20px; cursor: pointer;
      }
      .lesson { padding: 80px 22px 80px; }
      .lesson h2 { font-size: 30px; }
    }
    .backdrop { display: none; }
    .backdrop.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
  </style>
</head>
<body>
  <button class="menu-toggle" id="menuToggle">☰</button>
  <div class="backdrop" id="backdrop"></div>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-eyebrow">Program de învățare</span>
        <h1>AI Mastery</h1>
        <p>De la fundamentele modelelor la hub-uri fizice inteligente. Nivel tehnic. Aprofundăm zi de zi.</p>
      </div>
      <div class="progress-wrap">
        <div class="progress-label"><span>Progresul tău</span><span id="progressPct">0%</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div class="pinned-nav">
        <div class="pinned-item" id="manifestBtn">
          <span class="pinned-star">✦</span>
          <span class="pt"><span class="ps">Manifest</span>Cine suntem</span>
        </div>
      </div>
      <nav><ul class="module-nav" id="moduleNav"></ul></nav>
    </aside>

    <main class="main">
      <article class="lesson" id="lessonView"></article>
    </main>
  </div>

  <script>
  /* ══════════════════════════════════════════════════════════════
     CURRICULUM — structura de date. Fiecare lecție = un obiect.
     Extindem prin adăugarea de conținut în `body`. Lecțiile fără
     body încă apar ca "în curând — aprofundăm împreună".

            <p>Un <span class="keyterm">agent</span> nu doar răspunde — <strong>acționează în buclă</strong>: gândește → alege o unealtă → execută → observă rezultatul → repetă, până termină sarcina. Diferența față de un chat simplu e autonomia și accesul la unelte (căutare, cod, API-uri, baze de date).</p>
            <h3>Cele 4 ingrediente</h3>
            <ul>
              <li><strong>Loop</strong> — ciclul de raționament-acțiune.</li>
              <li><strong>Tools</strong> — ce poate face în lume (trimite mesaj, scrie în calendar, caută).</li>
              <li><strong>Planning</strong> — descompunerea unei sarcini mari în pași.</li>
              <li><strong>Memory</strong> — ce reține între pași și între sesiuni.</li>
            </ul>
            <div class="callout callout--hub">
              <span class="callout-label">Firul roșu — Hub-ul</span>
              <p>„Managerul AI" al hub-ului: un agent care dimineața citește rezervările, verifică stocul, îți scrie un rezumat, pregătește postarea zilei și-ți semnalează ce lipsește. Un angajat digital care nu doarme. Îl construim pas cu pas.</p>
            </div>
            <p class="placeholder"><em>Aprofundăm cu o implementare reală în lecțiile următoare.</em></p>
          ` },
        { title: "MCP — Model Context Protocol: cum conectezi AI la orice", duration: "24 min", level: "Arhitectură", body: "" },
        { title: "Sisteme multi-agent și orchestrare", duration: "22 min", level: "Arhitectură", body: "" }
      ]
    },
    {
      title: "Multimodal aplicat — branding, voce, video",
      lessons: [
        { title: "Generare de imagine pentru branding și marketing local", duration: "20 min", level: "Aplicat", body: "" },
        { title: "Asistent vocal pentru kiosk (STT + TTS)", duration: "26 min", level: "Aplicat", body: "" },
        { title: "Video generativ pentru social media", duration: "18 min", level: "Aplicat", body: "" }
      ]
    },
    {
      title: "Automatizări no-code / low-code + AI",
      lessons: [
        { title: "n8n, Make, Zapier: lipiciul dintre AI și business", duration: "24 min", level: "Automatizare", body: "" },
        { title: "Fluxuri reale: rezervări, recenzii, social, follow-up", duration: "28 min", level: "Automatizare", body: "" }
      ]
    },
    {
      title: "Etică, securitate, cost & GDPR",
      lessons: [
        { title: "Date personale, GDPR și confidențialitate", duration: "20 min", level: "Guvernanță", body: "" },
        { title: "Costuri: cum să nu te sperie factura", duration: "18 min", level: "Guvernanță", body: "" },
        { title: "Riscuri: prompt injection, halucinații, siguranță", duration: "20 min", level: "Guvernanță", body: "" }
      ]
    },
    {
      title: "Template-ul: hub-ul AI-powered replicabil",
      lessons: [
        { title: "Arhitectura hub-ului: creier AI + module fizice", duration: "30 min", level: "Capstone", body: `
            <p>Aici legăm totul. Template-ul tău e un <strong>sistem cu două straturi</strong>: stratul fizic (spațiul: frizerie, cafenea, bucătărie, loc de întâlnire) și stratul digital (creierul AI care îl face inteligent și replicabil).</p>
            <h3>Principiul de personalizare pe locație</h3>
            <p>Ce rămâne fix = mașinăria (cod, agenți, fluxuri). Ce se schimbă = un <strong>fișier de configurare al locației</strong>: identitate, ton, servicii, meniu, program, „povestea locului". O mănăstire și un șantier folosesc <em>același motor</em>, cu suflete diferite.</p>
            <table class="def">
              <tr><th>Locație</th><th>Aceleași module, altă față</th></tr>
              <tr><td>Mănăstire</td><td>Cafenea liniștită + prăvălie; asistent cald, ton contemplativ; conținut despre istorie și meșteșug.</td></tr>
              <tr><td>Șantier</td><td>Bucătărie rapidă + cafea tare + frizerie de weekend; asistent scurt, practic; program pe ture.</td></tr>
              <tr><td>Sat (DON, Mera)</td><td>Frizerie + cafea + loc de vorbă bărbătească; ton calm, comunitate, „vino, stai, vom vorbi".</td></tr>

              <span class="callout-label">Capstone</span>
              <p>Obiectivul final al cursului: să poți lua o locație nouă și, într-o săptămână, s-o pui online cu creierul AI configurat — programări, asistent, marketing, „manager digital". Asta e afacerea replicabilă.</p>
            </div>
          ` },
        { title: "Personalizare pe locație: mănăstire vs. șantier vs. sat", duration: "24 min", level: "Capstone", body: "" },
        { title: "Roadmap de lansare și model de business", duration: "26 min", level: "Capstone", body: "" }
      ]
    }
  ];

  /* ══════════════════════════════════════════════════════════════
     APP LOGIC
  ══════════════════════════════════════════════════════════════ */
  const STORAGE_KEY = 'ai-mastery-progress-v1';
  let state = { current: [0,0], done: {} };

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved) state = { ...state, ...saved };
    } catch(e) {}
  }
  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  const key = (m,l) => `${m}-${l}`;
  function totalLessons() { return CURRICULUM.reduce((n,mod)=>n+mod.lessons.length,0); }
  function doneCount() { return Object.values(state.done).filter(Boolean).length; }

  function buildNav() {
    const nav = document.getElementById('moduleNav');
    nav.innerHTML = '';
    CURRICULUM.forEach((mod, mi) => {
      const li = document.createElement('li');
      li.className = 'module' + (mi === state.current[0] ? ' open' : '');
      const doneInMod = mod.lessons.filter((_,li2)=>state.done[key(mi,li2)]).length;
      li.innerHTML = `
        <div class="module-head" data-mod="${mi}">
          <span class="module-num">${String(mi).padStart(2,'0')}</span>
          <span class="module-title">${mod.title}</span>
          <span class="module-caret">▶</span>
        </div>
        <ul class="lesson-list">
          ${mod.lessons.map((les,li2)=>`
            <li class="lesson-item ${state.done[key(mi, li2)]?'done':''} ${(mi===state.current[0]&&li2===state.current[1])?'active':''}" data-mod="${mi}" data-les="${li2}">
              <span class="lesson-check"></span>
              <span>${les.title}</span>
            </li>`).join('')}
        </ul>`;
      nav.appendChild(li);
    });
    nav.querySelectorAll('.module-head').forEach(h=>{
      h.addEventListener('click',()=>h.parentElement.classList.toggle('open'));
    });
    nav.querySelectorAll('.lesson-item').forEach(it=>{
      it.addEventListener('click',()=>{
        openLesson(+it.dataset.mod, +it.dataset.les);
        if (window.innerWidth <= 900) toggleSidebar(false);
      });
    });
  }

  function updateProgress() {
    const pct = Math.round(doneCount()/totalLessons()*100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressPct').textContent = pct + '%';
  }

  function openLesson(mi, li) {
    state.current = [mi, li];
    state.view = 'lesson';
    save();
    document.getElementById('manifestBtn').classList.remove('active');
    const mod = CURRICULUM[mi];
    const les = mod.lessons[li];
    const view = document.getElementById('lessonView');
    view.classList.remove('is-manifest');
    const isDone = !!state.done[key(mi,li)];
    const bodyHtml = les.body && les.body.trim()
      ? les.body
      : `<div class="placeholder"><div class="big">⛏️</div>
           <h3 style="border:none">În curând — aprofundăm împreună</h3>
           <p>Scheletul e aici. Când ajungem la această lecție, o scriem în detaliu, cu cod și exerciții — la ritmul tău, „pe zi ce trece".</p></div>`;

    view.innerHTML = `
      <div class="crumb">Modul ${String(mi).padStart(2,'0')} · ${mod.title}</div>
      <h2>${les.title}</h2>
      <div class="lesson-meta">
        <span class="tag tag--level">${les.level||'Lecție'}</span>
        <span class="tag">⏱ ${les.duration||'—'}</span>
        <span class="tag">Lecția ${li+1}/${mod.lessons.length}</span>
      </div>
      <div class="gold-line"></div>
      <div class="lesson-body">${bodyHtml}</div>
      <div class="lesson-footer">
        <button class="btn btn--nav" id="prevBtn">← Anterioara</button>
        <button class="btn btn--done ${isDone?'is-done':''}" id="doneBtn">
          ${isDone ? '✓ Finalizată' : 'Marchează ca finalizată'}
        </button>
        <button class="btn btn--nav" id="nextBtn">Următoarea →</button>
      </div>`;
    window.scrollTo({top:0, behavior:'smooth'});

    document.getElementById('doneBtn').addEventListener('click',()=>{
      state.done[key(mi,li)] = !state.done[key(mi,li)];
      save(); buildNav(); updateProgress(); openLesson(mi,li);
    });
    const flat = [];
    CURRICULUM.forEach((m,i)=>m.lessons.forEach((_,j)=>flat.push([i,j])));
    const idx = flat.findIndex(([a,b])=>a===mi&&b===li);
    const prev = document.getElementById('prevBtn');
    const next = document.getElementById('nextBtn');
    prev.disabled = idx<=0;
    next.disabled = idx>=flat.length-1;
    prev.addEventListener('click',()=>{ if(idx>0) openLesson(...flat[idx-1]); });
    next.addEventListener('click',()=>{ if(idx<flat.length-1) openLesson(...flat[idx+1]); });

    buildNav();
  }

  /* ── MANIFEST — Cine suntem ── */
  function openManifest() {
    state.view = 'manifest';
    save();
    document.getElementById('manifestBtn').classList.add('active');
    document.querySelectorAll('.lesson-item.active').forEach(el=>el.classList.remove('active'));
    const view = document.getElementById('lessonView');
    view.classList.add('is-manifest');
    view.innerHTML = `
      <div class="manifest">
        <header class="manifest-hero">
          <div class="m-eyebrow">Casă de AI &amp; Idei · Est. 2026</div>
          <div class="m-monogram">A</div>
          <h1>Cine <em>suntem</em></h1>
          <p class="m-tagline">Oameni care se încred în forțele proprii — și le transformă în platforme.</p>
          <div class="m-flourish">✦</div>
        </header>

        <div class="manifest-body">
          <section class="m-section">
            <div class="m-kicker">Ce reprezentăm</div>
            <h2><span class="num">01</span>Încrederea în forțele proprii</h2>
            <p class="m-lead">Nu așteptăm ca cineva din afară să ne construiască viitorul. Am descoperit un adevăr simplu și eliberator: <strong>putem ridica singuri un website complet funcțional</strong>, de la prima linie de cod până la clientul care apasă „rezervă". Ceea ce părea rezervat corporațiilor și agențiilor scumpe este, de fapt, la îndemâna celui care vrea să învețe.</p>
            <p>Suntem artizani ai epocii digitale. Îmbinăm meșteșugul vechi — răbdarea, grija pentru detaliu, mândria lucrului bine făcut — cu unealta cea mai puternică a momentului: inteligența artificială. Fiecare pagină pe care o construim este o dovadă că <strong>autonomia se învață</strong>, iar cunoașterea, odată dobândită, nu ne mai poate fi luată.</p>
            <div class="m-quote">Nu cumpărăm viitorul de-a gata. Îl artizanăm cu mâna noastră, rând cu rând.</div>
            <p>Aceasta reprezentăm: încredere, măiestrie și independență. Un atelier modern în care ideea devine platformă, iar platforma devine afacere.</p>
          </section>

          <section class="m-section">
            <div class="m-kicker">Obiectivele noastre</div>
            <h2><span class="num">02</span>Două ținte, un singur drum</h2>
            <div class="obj-grid">
              <div class="obj-card">
                <div class="obj-badge">a</div>
                <h3>Beneficii financiare prin monetizare</h3>
                <p>Transformăm platforma dintr-o vitrină într-un motor care aduce venit. Abonamente, servicii digitale, rezervări, parteneriate și produse — fiecare funcție construită are un rost economic clar. Nu creăm frumos de dragul frumosului; creăm valoare care se măsoară.</p>
                <span class="obj-tag">Venit sustenabil</span>
              </div>
              <div class="obj-card">
                <div class="obj-badge">b</div>
                <h3>Artizanarea site-ului &amp; ideile de business</h3>
                <p>Șlefuim fiecare detaliu al platformei ca un bijutier — design, viteză, experiență, „creierul" AI din spate. Și, în paralel, punem în practică ideile de business: hub-uri fizice inteligente, replicabile pe orice locație, de la o mănăstire la un șantier.</p>
                <span class="obj-tag">Meșteșug &amp; execuție</span>
              </div>
            </div>
          </section>

          <section class="m-section">
            <div class="m-kicker">Meșteșugul cafelei</div>
            <h2><span class="num">03</span>O notă de grație</h2>
            <p class="m-lead">Totul a început pe un podiș din Etiopia, în ținutul Kaffa. Legenda spune că un cioban pe nume Kaldi și-a văzut caprele jucând de bucurie după ce mâncaseră niște boabe roșii. Așa s-a născut prietenia dintre om și cafea — o poveste veche de peste o mie de ani.</p>
            <p>Din Yemen, prin primele case de cafea ale Orientului, cafeaua a călătorit la Veneția, Viena și Londra. Peste tot a devenit același lucru: nu doar o băutură, ci un <strong>pretext de a sta împreună și a vorbi</strong>. Casele de cafea erau numite „școli ale înțelepților". Exact spiritul locului nostru.</p>
            <div class="m-quote">Vino. Stai. Vom vorbi. — o cafea veritabilă cere doar un loc și niște prieteni.</div>

            <div class="m-subhead">Centura cafelei — de unde vine grația</div>
            <p>Cafeaua bună crește doar între Tropice, în „centura cafelei" — la altitudine, în soare blând și pământ vulcanic. Fiecare origine își pune amprenta ei, o notă distinctă de grație. Acestea sunt casele din care alegem boabele:</p>
            <div class="coffee-belt">
              <div class="origin-card">
                <div class="bean">◗◗◗</div>
                <span class="region">Africa · leagănul</span>
                <h4>Etiopia</h4>
                <div class="notes">Florală, iasomie și bergamotă, aciditate de citrice. Eleganță pură.</div>
              </div>
              <div class="origin-card">
                <div class="bean">◗◗</div>
                <span class="region">America de Sud</span>
                <h4>Columbia</h4>
                <div class="notes">Dulce-echilibrată, caramel și nucă, un final rotund. Cafeaua prietenoasă.</div>
              </div>
              <div class="origin-card">
                <div class="bean">◗◗</div>
                <span class="region">America de Sud</span>
                <h4>Brazilia</h4>
                <div class="notes">Ciocolată și alună, corp catifelat, aciditate joasă. Confort în ceașcă.</div>
              </div>
              <div class="origin-card">
                <div class="bean">◗◗◗</div>
                <span class="region">Africa de Est</span>
                <h4>Kenya</h4>
                <div class="notes">Coacăze negre, aciditate vie, structură de vin. Intensitate nobilă.</div>
              </div>
              <div class="origin-card">
                <div class="bean">◗◗</div>
                <span class="region">America Centrală</span>
                <h4>Guatemala</h4>
                <div class="notes">Cacao și condimente, corp plin, dulceață de fructe coapte.</div>
              </div>
              <div class="origin-card">
                <div class="bean">◗◗</div>
                <span class="region">America Centrală</span>
                <h4>Costa Rica</h4>
                <div class="notes">Miere și citrice limpezi, curată și strălucitoare. Lumină în ceașcă.</div>
              </div>
            </div>

            <div class="assets-line">
              <span class="asset-chip">Avem <b>vad</b></span>
              <span class="asset-chip">Avem <b>prieteni</b></span>
              <span class="asset-chip">Avem <b>cafenea</b></span>
              <span class="asset-chip">Avem <b>meserie</b></span>
            </div>
            <p class="assets-note">Deja achiziționăm boabele. Restul e meșteșug — și puțină gândire. Să gândim.</p>
          </section>

          <div class="m-cta">
            <h3>De la <em>manifest</em> la măiestrie</h3>
            <p>Cursul care urmează este drumul concret: de la fundamentele AI la hub-ul tău replicabil.</p>
            <button class="btn btn--enter" id="enterCourse">Începe cursul →</button>
          </div>
        </div>
      </div>`;
    window.scrollTo({top:0, behavior:'smooth'});
    document.getElementById('enterCourse').addEventListener('click',()=>{
      openLesson(state.current[0]||0, state.current[1]||0);
    });
    if (window.innerWidth <= 900) toggleSidebar(false);
  }
  document.getElementById('manifestBtn').addEventListener('click',()=>{
    openManifest();
    if (window.innerWidth <= 900) toggleSidebar(false);
  });

  /* mobile sidebar */
  function toggleSidebar(force) {
    const sb = document.getElementById('sidebar');
    const bd = document.getElementById('backdrop');
    const open = force===undefined ? !sb.classList.contains('open') : force;
    sb.classList.toggle('open', open);
    bd.classList.toggle('show', open);
  }
  document.getElementById('menuToggle').addEventListener('click',()=>toggleSidebar());
  document.getElementById('backdrop').addEventListener('click',()=>toggleSidebar(false));

  /* init */
  load();
  buildNav();
  updateProgress();
  if (state.view === 'lesson') {
    openLesson(state.current[0], state.current[1]);
  } else {
    openManifest();
  }
  </script>
</body>
